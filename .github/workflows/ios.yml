name: iOS

on:
  push:
    # Branches only: tag pushes build the IPA through release.yml instead.
    branches:
      - '**'
    paths:
      - 'ios/**'
      - 'core/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build Go Core XCFramework
        working-directory: core
        run: gomobile bind -target=ios,iossimulator -iosversion=26.0 -o ../ios/Core.xcframework .

      - name: Build Unsigned App
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Donggong.xcodeproj \
            -scheme Donggong \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Report Build Errors
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E '(error|fatal error): ' build/xcodebuild.log | sort -u | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Package IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/Donggong.app/Info.plist)
          mkdir -p dist/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Donggong.app dist/Payload/
          (cd dist && zip -qry "donggong-${VERSION}-unsigned.ipa" Payload)
          echo "IPA_PATH=dist/donggong-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donggong-ios-unsigned
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      # A build that dies at launch must not reach a release. On failure the system
      # exit reason and debugger stacks are the only way to see why without Xcode.
      - name: Build Simulator App
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Donggong.xcodeproj \
            -scheme Donggong \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-simulator.log

      - name: Launch On Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iOS 26 iPhone simulator is available"
            xcrun simctl list devices available
            exit 1
          fi
          mkdir -p build/launch
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Release-iphonesimulator/Donggong.app
          APP=io.github.devgaki.donggong

          # Plain launch: how long the app lives and what the system logs about its exit.
          LAUNCH=$(xcrun simctl launch \
            --stdout="$PWD/build/launch/stdout.log" \
            --stderr="$PWD/build/launch/stderr.log" \
            "$UDID" "$APP")
          PID=${LAUNCH##*: }
          ALIVE=yes
          for second in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              ALIVE=no
              echo "Donggong was gone after ${second} seconds"
              break
            fi
          done
          xcrun simctl io "$UDID" screenshot build/launch/screen.png || true
          sleep 3
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate "process == \"Donggong\" OR eventMessage CONTAINS \"${PID}\"" \
            > build/launch/system.log || true
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true

          if [ "$ALIVE" = no ]; then
            # Debugged launch: record every stop, or the stacks after 40 seconds of running.
            sudo DevToolsSecurity -enable || true
            cat > "$RUNNER_TEMP/launch_debug.py" <<'EOF'
          import os
          import threading

          import lldb


          def describe(process, out):
              state = process.GetState()
              out.write(f"state: {lldb.SBDebugger.StateAsCString(state)}\n")
              if state == lldb.eStateExited:
                  out.write(f"exit status: {process.GetExitStatus()} {process.GetExitDescription()}\n")
              else:
                  for thread in process:
                      out.write(
                          f"thread #{thread.GetIndexID()} name={thread.GetName()} "
                          f"queue={thread.GetQueueName()} stop={thread.GetStopDescription(256)}\n"
                      )
                      for frame in thread:
                          out.write(f"    {frame}\n")
              out.flush()


          def __lldb_init_module(debugger, internal_dict):
              out = open(os.environ["LLDB_REPORT"], "w")
              debugger.SetAsync(False)
              target = debugger.CreateTarget("")
              error = lldb.SBError()
              process = target.AttachToProcessWithID(debugger.GetListener(), int(os.environ["APP_PID"]), error)
              if not error.Success():
                  out.write(f"attach failed: {error}\n")
                  out.close()
                  return
              signals = process.GetUnixSignals()
              urg = signals.GetSignalNumberFromName("SIGURG")
              signals.SetShouldStop(urg, False)
              signals.SetShouldNotify(urg, False)
              timed_out = threading.Event()

              def interrupt():
                  timed_out.set()
                  process.SendAsyncInterrupt()

              timer = threading.Timer(40, interrupt)
              timer.start()
              for _ in range(10):
                  process.Continue()
                  if process.GetState() == lldb.eStateExited:
                      describe(process, out)
                      break
                  if timed_out.is_set():
                      out.write("still running after 40 seconds\n")
                      describe(process, out)
                      process.Kill()
                      break
                  out.write("stopped\n")
                  describe(process, out)
              timer.cancel()
              out.close()
          EOF
            # GOTRACEBACK=crash turns a Go fatal error into SIGABRT so the debugger stops on it.
            LAUNCH=$(SIMCTL_CHILD_GOTRACEBACK=crash xcrun simctl launch --wait-for-debugger \
              --stdout="$PWD/build/launch/stdout-debug.log" \
              --stderr="$PWD/build/launch/stderr-debug.log" \
              "$UDID" "$APP")
            APP_PID=${LAUNCH##*: } LLDB_REPORT="$PWD/build/launch/lldb.txt" \
              xcrun lldb --batch -o "command script import $RUNNER_TEMP/launch_debug.py" \
              > build/launch/lldb.log 2>&1 || true
            xcrun simctl io "$UDID" screenshot build/launch/screen-debug.png || true

            echo "::error::Donggong exited within 30 seconds of launch"
            grep -v '^CoreData' build/launch/stderr.log || true
            grep -iE 'terminat|exit|signal|crash|kill|watchdog' build/launch/system.log | grep -v CoreData | tail -40 || true
            cat build/launch/lldb.txt || cat build/launch/lldb.log || true
            exit 1
          fi

      - name: Upload Launch Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donggong-ios-launch
          path: build/launch
          if-no-files-found: ignore
