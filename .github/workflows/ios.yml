name: iOS

on:
  push:
    # Branches only: tag pushes build the IPA through release.yml instead.
    branches:
      - '**'
    paths:
      - 'ios/**'
      - 'core/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build Go Core XCFramework
        working-directory: core
        run: gomobile bind -target=ios,iossimulator -iosversion=26.0 -o ../ios/Core.xcframework .

      - name: Build Unsigned App
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Donggong.xcodeproj \
            -scheme Donggong \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Report Build Errors
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E '(error|fatal error): ' build/xcodebuild.log | sort -u | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Package IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/Donggong.app/Info.plist)
          mkdir -p dist/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Donggong.app dist/Payload/
          (cd dist && zip -qry "donggong-${VERSION}-unsigned.ipa" Payload)
          echo "IPA_PATH=dist/donggong-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donggong-ios-unsigned
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      # A build that dies at launch must not reach a release, and the crash report
      # is the only way to see why from a machine without Xcode.
      - name: Build Simulator App
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Donggong.xcodeproj \
            -scheme Donggong \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-simulator.log

      - name: Launch On Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iOS 26 iPhone simulator is available"
            xcrun simctl list devices available
            exit 1
          fi
          mkdir -p build/launch
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/DerivedData/Build/Products/Release-iphonesimulator/Donggong.app
          sudo DevToolsSecurity -enable || true
          # GOTRACEBACK=crash turns a Go fatal error into SIGABRT so the debugger stops on it.
          LAUNCH=$(SIMCTL_CHILD_GOTRACEBACK=crash xcrun simctl launch --wait-for-debugger \
            --stdout="$PWD/build/launch/stdout.log" \
            --stderr="$PWD/build/launch/stderr.log" \
            "$UDID" io.github.devgaki.donggong)
          PID=${LAUNCH##*: }
          echo "Launched pid ${PID}"
          # The debugger records the stop reason and every thread's stack if the app dies.
          # Go preempts goroutines with SIGURG, which must pass through silently.
          xcrun lldb --batch \
            -o "process attach --pid ${PID}" \
            -o "process handle SIGURG --stop false --notify false --pass true" \
            -o "continue" \
            -k "process status" \
            -k "thread backtrace all" \
            > build/launch/lldb.log 2>&1 &
          LLDB_PID=$!
          ALIVE=yes
          for second in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              ALIVE=no
              echo "Donggong was gone after ${second} seconds"
              break
            fi
          done
          sleep 5
          xcrun simctl io "$UDID" screenshot build/launch/screen.png || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate "process == \"Donggong\" OR eventMessage CONTAINS \"${PID}\" OR eventMessage CONTAINS[c] \"devgaki\"" \
            > build/launch/system.log || true
          ls -la ~/Library/Logs/DiagnosticReports/ > build/launch/reports.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/Donggong*.ips build/launch/ 2>/dev/null || true
          kill "$LLDB_PID" 2>/dev/null || true
          echo "::group::lldb"
          cat build/launch/lldb.log || true
          echo "::endgroup::"
          if [ "$ALIVE" = no ]; then
            echo "::error::Donggong exited within 30 seconds of launch"
            grep -v '^CoreData' build/launch/stderr.log || true
            grep -iE 'terminat|exit|signal|crash|kill' build/launch/system.log | grep -v CoreData | tail -40 || true
            exit 1
          fi

      - name: Upload Launch Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donggong-ios-launch
          path: build/launch
          if-no-files-found: ignore
