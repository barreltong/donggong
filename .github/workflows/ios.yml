name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'core/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build Go Core XCFramework
        working-directory: core
        run: gomobile bind -target=ios,iossimulator -iosversion=26.0 -o ../ios/Core.xcframework .

      - name: Build Unsigned App
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Donggong.xcodeproj \
            -scheme Donggong \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Report Build Errors
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E '(error|fatal error): ' build/xcodebuild.log | sort -u | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Package IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/Donggong.app/Info.plist)
          mkdir -p dist/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Donggong.app dist/Payload/
          (cd dist && zip -qry "donggong-${VERSION}-unsigned.ipa" Payload)
          echo "IPA_PATH=dist/donggong-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donggong-ios-unsigned
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
