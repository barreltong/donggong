name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set Up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install gomobile
        run: |
          cd core
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build Go Core AAR
        run: |
          mkdir -p app/libs
          cd core
          gomobile bind -target=android -androidapi=26 -o ../app/libs/core.aar .
          cd ..

      - name: Restore Android Keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
          cat <<EOF > key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/release-keystore.jks
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  build-ios:
    uses: ./.github/workflows/ios.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/android

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: donggong-ios-unsigned
          path: artifacts/ios

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/android/app-release.apk "dist/donggong-${GITHUB_REF_NAME}.apk"
          ipa=(artifacts/ios/*.ipa)
          if [ "${#ipa[@]}" -ne 1 ] || [ ! -f "${ipa[0]}" ]; then
            echo "::error::Expected exactly one IPA artifact"
            exit 1
          fi
          cp "${ipa[0]}" "dist/donggong-${GITHUB_REF_NAME}-unsigned.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/donggong-${{ github.ref_name }}.apk
            dist/donggong-${{ github.ref_name }}-unsigned.ipa
